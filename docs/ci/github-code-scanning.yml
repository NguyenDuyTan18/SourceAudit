# Copy this workflow to .github/workflows/srcaudit.yml in the repository you want to scan.
# - Pull request: Scan files changed relative to the target branch (--diff).
# - Push to the default branch: scan the full repository.
# GitHub displays SARIF results under Security → Code scanning and as pull request annotations.
name: SrcAudit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # Required by upload-sarif

jobs:
  srcaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # --diff needs the Git history to calculate the merge base
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: NguyenDuyTan18/SourceAudit
          # Pin a reviewed SrcAudit commit before running this workflow in CI.
          # ref: <SrcAudit commit SHA>
          path: .srcaudit-tool
          persist-credentials: false

      # Move the scanner outside the workspace so the scan excludes SrcAudit's own examples.
      - run: mv .srcaudit-tool "$RUNNER_TEMP/srcaudit"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts
        working-directory: ${{ runner.temp }}/srcaudit

      - name: Scan source code
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--src . --out "$RUNNER_TEMP/srcaudit-report" --fail-on high)
          if [ "$EVENT_NAME" = "pull_request" ]; then args+=(--diff "origin/$BASE_REF"); fi
          # Optional: add --baseline path/to/report.json to report new findings only.
          status=0
          node "$RUNNER_TEMP/srcaudit/scan.mjs" "${args[@]}" || status=$?
          if [ -s "$RUNNER_TEMP/srcaudit-report/report.sarif" ]; then echo 'sarif_ready=true' >> "$GITHUB_OUTPUT"; fi
          exit "$status"

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif_ready == 'true' }}
        uses: github/codeql-action/upload-sarif@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          sarif_file: ${{ runner.temp }}/srcaudit-report/report.sarif
          category: srcaudit
