# Mẫu workflow: chép vào .github/workflows/srcaudit.yml của repo cần quét.
# - Pull request: chỉ quét file thay đổi so với nhánh đích (--diff).
# - Push lên nhánh mặc định: quét toàn bộ repo.
# Kết quả SARIF hiện trong tab Security → Code scanning và chú thích trực tiếp trên PR.
name: SrcAudit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # cần cho upload-sarif

jobs:
  srcaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # --diff cần lịch sử để tính merge-base
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: NguyenDuyTan18/SourceAudit
          # Chọn commit SrcAudit đã kiểm tra trước khi đưa mẫu này vào CI.
          # ref: <commit của SrcAudit>
          path: .srcaudit-tool
          persist-credentials: false

      # Chuyển công cụ ra ngoài workspace để không quét chính mã mẫu của SrcAudit.
      - run: mv .srcaudit-tool "$RUNNER_TEMP/srcaudit"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts
        working-directory: ${{ runner.temp }}/srcaudit

      - name: Quét mã nguồn
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--src . --out "$RUNNER_TEMP/srcaudit-report" --fail-on high)
          if [ "$EVENT_NAME" = "pull_request" ]; then args+=(--diff "origin/$BASE_REF"); fi
          # Tùy chọn: thêm --baseline đường/dẫn/report.json để chỉ báo phát hiện mới.
          status=0
          node "$RUNNER_TEMP/srcaudit/scan.mjs" "${args[@]}" || status=$?
          if [ -s "$RUNNER_TEMP/srcaudit-report/report.sarif" ]; then echo 'sarif_ready=true' >> "$GITHUB_OUTPUT"; fi
          exit "$status"

      - name: Tải SARIF lên GitHub code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif_ready == 'true' }}
        uses: github/codeql-action/upload-sarif@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          sarif_file: ${{ runner.temp }}/srcaudit-report/report.sarif
          category: srcaudit
