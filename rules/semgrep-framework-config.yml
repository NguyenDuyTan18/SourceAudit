rules:
  - id: srcaudit-github-actions-script-injection
    languages: [yaml]
    severity: ERROR
    message: Pass event data via a step environment variable and quote it when expanding it in the shell.
    paths:
      include:
        - "**/.github/workflows/*.yml"
    patterns:
      - pattern: |
          - run: $SCRIPT
      - pattern-inside: 'steps: ...'
      - metavariable-regex:
          metavariable: $SCRIPT
          regex: '(?s).*\$\{\{\s*github\.(?:head_ref|event\.(?:pull_request\.(?:title|body|head\.(?:ref|label))|issue\.(?:title|body)|comment\.body|head_commit\.message))\s*\}\}'

  - id: srcaudit-dockerfile-root-user
    languages: [dockerfile]
    severity: WARNING
    message: Set a non-root USER in the final stage and verify the runtime user.
    pattern-either:
      - patterns:
          - pattern: USER $USER
          - pattern-regex: '(?m)^[ \t]*(?i:USER)[ \t]+(?:root|0)(?::[^\s]+)?[ \t]*\r?$(?![\s\S]*^[ \t]*(?i:FROM|USER)[ \t])'
      - pattern-regex: '(?m)^[ \t]*(?i:FROM)[ \t]+(?:--platform=\S+[ \t]+)?(?:scratch|(?:docker\.io/library/)?(?:alpine|busybox)(?::[a-zA-Z0-9_.-]+)?)(?:[ \t]+(?i:AS)[ \t]+\S+)?[ \t]*\r?$(?![\s\S]*^[ \t]*(?i:FROM|USER)[ \t])'

  - id: srcaudit-node-jwt-literal-verification-key
    languages: [javascript, typescript]
    severity: ERROR
    message: Load the HMAC key from a secret manager.
    patterns:
      - pattern: 'jsonwebtoken.verify($TOKEN, $KEY, { algorithms: [$ALGORITHM], ... }, ...)'
      - metavariable-regex:
          metavariable: $KEY
          regex: "^(?:'[^']+'|\"[^\"]+\")$"
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: "^[\"']HS(?:256|384|512)[\"']$"
      - focus-metavariable: $KEY

  - id: srcaudit-spring-jdbc-template-sql-injection
    languages: [java]
    severity: ERROR
    message: Bind request values as query parameters in JdbcTemplate.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $METHOD(..., @org.springframework.web.bind.annotation.RequestParam $TYPE $VALUE, ...) {
                    ...
                  }
              - pattern-inside: |
                  $RET $METHOD(..., @org.springframework.web.bind.annotation.RequestParam(...) $TYPE $VALUE, ...) {
                    ...
                  }
          - focus-metavariable: $VALUE
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $DB).query($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $DB).queryForObject($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $DB).queryForList($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $DB).update($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $DB).execute($SQL, ...)
          - focus-metavariable: $SQL

  - id: srcaudit-laravel-raw-sql-injection
    languages: [php]
    severity: ERROR
    message: Bind request values separately from the raw SQL statement.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQUEST->input(...)
          - pattern: $REQUEST->query(...)
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: DB::select($SQL, ...)
              - pattern: DB::selectOne($SQL, ...)
              - pattern: DB::statement($SQL, ...)
              - pattern: DB::unprepared($SQL, ...)
          - focus-metavariable: $SQL

  - id: srcaudit-rails-http-ssrf
    languages: [ruby]
    severity: ERROR
    message: Select the destination from a fixed set of service URLs.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              class $CONTROLLER < ApplicationController
                ...
              end
          - pattern-either:
              - pattern: params[...]
              - pattern: params.fetch(...)
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Net::HTTP.get($URL, ...)
              - pattern: Net::HTTP.get_response($URL, ...)
          - focus-metavariable: $URL
